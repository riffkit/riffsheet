name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.6
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      RIFFSHEET_REQUIRE_FFMPEG: "1"  # a missing ffmpeg or filter fails the run instead of skipping every test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg 7 or newer (Linux)
        if: runner.os == 'Linux'
        # the distribution's ffmpeg is older than 7: use a static build with freetype, fontconfig and x264
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz
          mkdir -p "$HOME/ffmpeg"
          tar -xf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -version | head -1
      - run: python -I scripts/riffsheet.py --version
      - name: tests
        run: |
          python -B -m unittest -v 2>&1 | tee test.log
          ! grep -q "skipped" test.log
